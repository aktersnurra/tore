<g id="sparks" fill="#d5a04c"><path d="M26 46Q27 52 32 53Q27 54 26 61Q25 55 20 53Q25 51 26 46Z" /><path d="M115 33Q116 41 122 42Q116 44 115 52Q113 44 108 42Q114 40 115 33Z" /></g>
<g id="coat"><path fill="var(--shade)" d="M72 77C92 77 104 91 106 115Q108 125 98 127Q73 132 46 127Q39 125 39 119C40 97 49 78 72 77Z" /><path fill="var(--linen)" d="M71 78C92 78 101 94 102 115Q104 122 96 124Q71 129 44 123Q40 122 40 117C43 94 50 78 71 78Z" /><path d="M76 94Q80 108 79 123" stroke="#d7c6ab" fill="none" stroke-width="1.5" /><g fill="#817261"><circle cx="73" cy="104" r="1.9" /><circle cx="73.5" cy="114" r="1.9" /></g></g>
<path id="sprout" fill="var(--stitch,#bfcba5)" d="M0 1Q-5 1-6-5Q-1-5 1-1Q1-7 6-9Q8-2 2 1L1 4Z" />
<g id="toque"><path fill="#f8ead4" stroke="#cebfa8" stroke-width="1.6" d="M-21 0L-23-14C-33-17-31-32-21-34Q-16-36-11-34C-8-45 8-46 13-36C25-41 34-29 28-20Q26-16 21-14L20 0Q1 5-21 0Z" /><path fill="#e2cfb1" d="M-21-7Q0-11 21-7L20 0Q0 3-21 0Z" /><path d="M-16-25Q-12-21-12-14M12-27Q9-22 10-15" stroke="#d9c8b0" fill="none" stroke-width="1.7" stroke-linecap="round" /></g>
<path id="vapour" fill="#97a99c" d="M0 0C8-8-7-10 2-22Q0-15 5-10Q10-5 0 0ZM12-3C17-9 8-13 15-18Q13-13 16-10Q20-6 12-3Z"/>
    <!-- A freestanding enamel hob, its feet and single brass control. -->
    <g id="hob"><path fill="#56685d" d="M69 130H129L127 136H120L119 133H78L77 136H70Z"/><rect x="64" y="119" width="69" height="14" rx="5" fill="#58816a"/><rect x="63" y="117" width="71" height="5" rx="2.5" fill="#8ea78c"/><circle cx="121" cy="126.5" r="3.8" fill="#ead4a6"/><path d="M121 124.7V126.5" stroke="#937b58" stroke-width="1.5" stroke-linecap="round"/></g>
