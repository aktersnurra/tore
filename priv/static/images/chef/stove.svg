  <g class="scene">
    
    <g class="retreat"><g class="hop"><g class="breath">
      <g transform="translate(-12 1) scale(.96)">
<g id="stage-1" class="stage" transform="translate(8.6 15.5) scale(.88)" style="--sleeve:#adc3ae;--cuff:#dde3c9">
      <use href="#clogs" />
      <path fill="#adc3ae" d="M48 85Q69 75 92 84Q104 96 102 114H41Q38 94 48 85Z" />
      <path fill="#507d65" d="M50 83L58 81L60 93Q68 97 83 91L86 81L94 84L90 97Q103 107 105 122Q106 127 101 128Q71 134 40 127Q38 120 45 102L52 93Z" />
      <path fill="#79a08a" d="M60 107Q70 110 81 106L81 114Q80 121 72 121Q61 121 60 114Z" />
      <use href="#sprout" transform="translate(71 116) scale(.72)" />
      <g transform="translate(71 67)"><g class="head"><use href="#face" /><use class="lids" href="#lid-pair" /><g class="attention"><use class="eyes" href="#eye-pair" /></g><use class="smile" href="#grin" /><use class="oh" href="#gasp" />
        <path class="hat" fill="var(--curl)" d="M-18-22Q-18-33-9-34Q-3-35-1-31Q-7-31-8-26Q3-36 10-32Q9-27 2-24Z" /></g></g>
      <use class="raised" href="#hands-up" /><use class="glint" href="#sparks" />
    </g>
<g id="stage-2" class="stage" transform="translate(4.3 8.2) scale(.94)" style="--sleeve:#efd8ad">
      <use href="#clogs" /><path fill="#efd8ad" d="M49 83Q72 76 93 84Q107 96 100 120H41Q38 97 49 83Z" />
      <path fill="#59816b" d="M54 84L61 83L63 94Q74 96 83 92L84 82L91 84L89 97L103 121Q107 127 99 128Q70 132 42 127Q39 126 42 117L54 93Z" />
      <path fill="#83a18a" d="M46 112Q73 119 99 111L101 116Q73 123 44 117Z" />
      <g transform="translate(71 64)"><g class="head"><use href="#face" /><use class="lids" href="#lid-pair" /><g class="attention"><use class="eyes" href="#eye-pair" /></g><use class="smile" href="#grin" /><use class="oh" href="#gasp" />
        <g class="hat"><path fill="#f8e9cd" stroke="#c8b89c" stroke-width="1.6" stroke-linejoin="round" d="M-24-18L-26-38Q-24-40-21-39L3-34L23-39L24-23Q3-15-24-18Z" /><path fill="#ddcaab" d="M-24-18L-15-26L23-39L24-23Q1-16-24-18Z" /><path fill="#faf0dd" d="M-24-18L-25-25Q-1-25 23-36L23-27Q3-18-24-18Z" /></g></g></g>
      <use class="raised" href="#hands-up" /><use class="glint" href="#sparks" />
    </g>
<g id="stage-3" class="stage">
      <use href="#clogs" /><use href="#coat" /><use href="#necker" />
      <g transform="translate(71 60)"><g class="head"><use href="#face" /><use class="lids" href="#lid-pair" /><g class="attention"><use class="eyes" href="#eye-pair" /></g><use class="smile" href="#grin" /><use class="oh" href="#gasp" />
        <g class="hat"><path fill="#fff0db" stroke="#cdbda3" stroke-width="1.6" d="M-24-17Q-31-33-19-37Q-2-43 18-40Q29-38 25-25L22-20Q0-14-24-17Z" /><path fill="#dfcfb4" d="M-25-23Q-4-20 24-28L22-20Q-1-14-24-17Z" /></g></g></g>
      <use class="raised" href="#hands-up" /><use class="glint" href="#sparks" />
    </g>
<g id="stage-4" class="stage">
      <use href="#clogs" /><use href="#coat" transform="translate(-4.3 -3.8) scale(1.06 1.03)" /><use href="#necker" />
      <g transform="translate(68 59)"><g class="head"><use href="#face" /><use class="lids" href="#lid-pair" /><g class="attention"><use class="eyes" href="#eye-pair" /></g><use class="smile" href="#grin" /><use class="oh" href="#gasp" /><g transform="translate(0 -19) rotate(-5) scale(.93 .64)"><use class="hat" href="#toque" /></g></g></g>
      <use class="raised" href="#hands-up" /><use class="glint" href="#sparks" />
    </g>
<g id="stage-5" class="stage">
      <use href="#clogs" transform="translate(-6.5 0) scale(1.09 1)" />
      <path fill="var(--shade)" d="M70 76C95 74 110 88 115 110Q122 128 104 130Q69 136 38 129Q24 127 31 106Q39 79 70 76Z" /><path fill="var(--linen)" d="M69 77Q102 73 111 103Q122 126 99 127Q69 131 36 125Q28 123 33 106Q42 81 69 77Z" />
      <path d="M76 90Q87 106 84 127" fill="none" stroke="#ddcaaa" stroke-width="1.6" /><g fill="#7f705e"><circle cx="77" cy="122" r="2" /><circle cx="91" cy="121" r="2" /></g><use href="#necker" transform="translate(-10 -4) scale(1.14 1.04)" />
      <g transform="translate(72 62) scale(1.12 1.04)"><g class="head"><use href="#face" /><use class="lids" href="#lid-pair" /><g class="attention"><use class="eyes" href="#eye-pair" />
        </g><g class="smile"><path fill="var(--ink)" d="M-12 13Q1 16 12 12Q11 22 2 23Q-8 23-12 13Z" /><path fill="#fff1d7" d="M-9 14Q1 17 10 13Q7 19 0 18Q-6 18-9 14Z" /><path fill="#df947c" d="M-3 21Q2 18 8 19Q4 24-3 21Z" /></g><use class="oh" href="#gasp" />
        <path fill="var(--curl)" d="M0 7C-4 3-9 4-13 7Q-18 10-22 5Q-21 14-13 15Q-5 16 0 10Q7 15 14 13Q21 11 22 3Q17 9 12 6Q5 2 0 7Z" />
        <path d="M-16-6Q-12-10-8-7M8-8Q12-11 15-8" fill="none" stroke="var(--curl)" stroke-width="1.7" stroke-linecap="round" />
        <g transform="translate(0 -14) rotate(-5) scale(1 .8)"><g class="hat"><path fill="#fff0d8" stroke="#cbbb9f" stroke-width="1.5" d="M-20 1L-23-20C-31-22-32-33-24-37Q-19-40-13-37C-10-47 5-47 11-39C23-45 34-33 27-23L22-19L20 1Q0 5-20 1Z" /><path d="M-15-29Q-12-21-12-12M13-31Q10-22 10-13" fill="none" stroke="#d6c5ac" stroke-width="1.6" stroke-linecap="round" /><path fill="#e6d3b4" d="M-21-7Q0-10 21-6L20 1Q1 5-20 1Z" /><use href="#sprout" transform="translate(13 -2) scale(.68)" style="--stitch:#63856a" /></g></g></g></g>
      <use class="raised" href="#hands-up" transform="translate(-8.6 0) scale(1.12 1)" /><use class="glint" href="#sparks" />
    </g>
      </g>
      <g class="working"><use href="#cook-hands"/></g>
    </g></g></g>
    <use href="#hob"/><use href="#casserole"/><use href="#blue-flame" class="fire"/><g class="retreat"><g class="hop"><g class="breath"><g class="working"><use href="#ladle" class="ladle"/></g></g></g></g><use href="#enamel-lip"/><g transform="translate(108 86)"><use href="#vapour" class="steam"/></g>
  </g>
</svg>
