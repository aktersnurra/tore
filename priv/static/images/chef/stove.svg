    <g id="ladle"><path fill="#97623e" d="M78 73Q75 68 79 67Q82 65 84 70L99 88Q104 87 107 91Q110 96 103 97Q97 99 95 93Z"/><path fill="var(--skin)" d="M73 97Q69 94 74 89L80 82Q79 77 83 77Q87 76 87 81Q92 80 92 85Q92 90 83 96Z"/></g>

