<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" class="stage-1 idle" role="img" aria-labelledby="chef-title">
  <title id="chef-title">Tore’s cook at the stove</title>
  <style>
    svg { --skin:#efb286; --curl:#574039; --ink:#49352f; --linen:#fff0d8; --shade:#dfd0b6; --leaf:#46765b; --cuff:#f1ddbc; --sleeve:#fff0d8 }
    .stage { display:none }
    svg:not([data-stage]).stage-1 #stage-1, svg[data-stage="1"] #stage-1,
    svg:not([data-stage]).stage-2 #stage-2, svg[data-stage="2"] #stage-2,
    svg:not([data-stage]).stage-3 #stage-3, svg[data-stage="3"] #stage-3,
    svg:not([data-stage]).stage-4 #stage-4, svg[data-stage="4"] #stage-4,
    svg:not([data-stage]).stage-5 #stage-5, svg[data-stage="5"] #stage-5 { display:inline }
    .raised,.glint,.oh,.lids { opacity:0 }
    .hop,.breath { transform-origin:72px 133px }
    .eyes,.hat,.raised,.glint { transform-box:fill-box; transform-origin:center }
    .raised { transform-origin:center bottom }
    .head { transform-origin:0px 22px }
    .idle .breath { animation:breathe 3.6s ease-in-out infinite }
    .idle .eyes { animation:blink 4.9s ease-in-out infinite }
    .tapped .hop { animation:hop 600ms cubic-bezier(.32,.02,.26,1) }
    .tapped .oh { animation:show 600ms ease-in-out }
    .tapped .smile,.cheer .working { animation:hide var(--reaction) ease-in-out }
    .tapped { --reaction:600ms } .cheer { --reaction:1200ms }
    .cheer .raised { animation:lift 1200ms cubic-bezier(.22,.75,.24,1) }
    .cheer .hat { animation:toss 1200ms ease-in-out }
    .cheer .glint { animation:twinkle 1200ms ease-in-out }
    .look .eyes { animation:glance 1600ms ease-in-out }
    .look .head { animation:turn 1600ms ease-in-out }
    @keyframes turn { 19%,37% { transform:translateX(1.5px) rotate(3deg) } 64%,76% { transform:translateX(-1px) rotate(-2deg) } }
    @keyframes glance { 12%,38% { transform:translate(3.6px,.3px) } 57%,79% { transform:translate(-3px,-.5px) } }
    @keyframes breathe { 50% { transform:scale(.993,1.012) } }
    @keyframes blink { 0%,55%,59%,100% { transform:scaleY(1) } 57% { transform:scaleY(.12) } }
    @keyframes hop { 19% { transform:scale(1.06,.94) } 48% { transform:translateY(-5.5px) scale(.97,1.015) } 73% { transform:scale(1.035,.96) } 89% { transform:scale(.99,1.012) } }
    @keyframes show { 0%,100% { opacity:0 } 16%,80% { opacity:1 } }
    @keyframes hide { 0%,100% { opacity:1 } 16%,80% { opacity:0 } }
    @keyframes lift { 0%,100% { opacity:0; transform:translateY(6px) scaleX(.92) } 16%,80% { opacity:1 } 31% { transform:translateY(-2px) scaleX(1.02) } 50%,80% { transform:none } }
    @keyframes toss { 15% { transform:translateY(1px) } 36% { transform:translateY(-5px) rotate(-4deg) } 58% { transform:rotate(2deg) } 73% { transform:translateY(-1px) } }
    @keyframes twinkle { 0%,18%,85%,100% { opacity:0; transform:scale(.5) } 43%,65% { opacity:1; transform:scale(1) } }
    @keyframes fade { 45% { opacity:.64 } }
    .idle .steam { animation:curl-up 3.8s ease-in-out infinite }
    @keyframes curl-up { 0%,100% { transform:none; opacity:.55 } 55% { transform:translate(1.7px,-3px); opacity:.93 } }
    .idle .fire { transform-box:fill-box; transform-origin:center bottom; animation:kindle 1.7s ease-in-out infinite }
    .idle .ladle { transform-origin:77px 85px; animation:stir-twice 6.6s ease-in-out infinite }
    @keyframes kindle { 40% { transform:scale(.94,1.12) skewX(-4deg) } 75% { transform:scale(1.02,.91) } }
    @keyframes stir-twice { 0%,34%,77%,100% { transform:none } 44%,65% { transform:translate(3px,-1px) rotate(-7deg) } 54%,72% { transform:translate(-2px,1px) rotate(4deg) } }
    .proud .retreat { transform-origin:53px 132px; animation:step-back 900ms ease-in-out }
    .proud .head { animation:satisfied-nod 900ms ease-in-out }
    .proud .eyes { animation:hide 900ms ease-in-out }
    .proud .lids { transform:scaleY(-1); animation:show 900ms ease-in-out }
    @keyframes step-back { 16% { transform:translateX(1px) } 42%,65% { transform:translate(-7px,-2px) scale(.96) } 84% { transform:translate(-2px,0) } }
    @keyframes satisfied-nod { 15% { transform:translateY(-1px) } 44%,56% { transform:translateY(3.7px) rotate(-3deg) scaleY(.95) } 82% { transform:translateY(-.7px) rotate(.7deg) } }
    @media (prefers-reduced-motion:reduce) {
      .scene * { animation:none !important }
      .tapped .scene { animation:fade 600ms ease-in-out }
      .cheer .scene { animation:fade 1200ms ease-in-out }
      .look .scene { animation:fade 1600ms ease-in-out }
      .proud .scene { animation:fade 900ms ease-in-out }
    }
  </style>
  <defs>
<g id="face">
      <path fill="var(--curl)" d="M-26 5C-31-6-28-21-19-26C-7-34 15-31 23-21Q32-12 26 6Z" />
      <ellipse cx="-26" cy="3" rx="5.8" ry="7" fill="var(--skin)" /><ellipse cx="26" cy="3" rx="5.8" ry="7" fill="var(--skin)" />
      <path fill="var(--skin)" d="M-25-10C-25-23-14-25 0-25S24-21 25-10L27 5C29 18 17 25 1 25C-15 25-28 20-27 8Z" />
      <path fill="var(--curl)" d="M-26-2C-27-18-25-27-11-29C0-32 13-28 19-23C15-16 7-12 0-13Q4-16 4-20C-2-14-8-11-15-12Q-10-16-10-19Q-21-16-22-5Q-23-1-26-2Z" />
      <g fill="#dc8c70"><ellipse cx="-18" cy="7.8" rx="6" ry="3.6" /><ellipse cx="18.5" cy="7" rx="5.5" ry="3.3" /></g>
      <g fill="#845647"><circle cx="-20" cy="7" r="1" /><circle cx="-16.5" cy="8.6" r=".9" /></g>
      <path d="M-3.8 3Q-.5-.3 3 2.3Q6.5 6.4 1.1 7.1Q-4.3 7.8-3.8 3Z" fill="#d88c68" />
    </g>
<g id="eye-pair" fill="var(--ink)"><ellipse cx="-11.4" cy="-.2" rx="2.6" ry="3.5" /><ellipse cx="11.4" cy="-.2" rx="2.6" ry="3.5" /></g>
<path id="lid-pair" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" d="M-15.7-.5Q-11.8 4.1-7.4 0M7.4 0Q11.7 4.1 15.7-.7" />
<path id="grin" fill="var(--ink)" d="M-7.6 12.1Q-1 14.6 6.8 10.7C5.8 17.6-3.5 20.2-7.6 12.1Z" />
<ellipse id="gasp" fill="var(--ink)" cx="1" cy="15" rx="3.4" ry="4.2" />
<g id="clogs"><path fill="#56655b" d="M47 117H96L92 132H78L73 124L69 132H52Z" /><path fill="var(--curl)" d="M54 127Q61 125 68 129L68 133Q67 136 62 136H49Q44 135 46 132Q48 128 54 127ZM80 128Q88 125 94 129Q102 130 101 134Q100 136 95 136H80Q76 135 77 132Z" /></g>
<g id="necker"><path fill="#b8403a" d="M49 83Q68 89 93 81L75 95Q71 97 68 94Z" /><path fill="#cf6651" d="M72 92Q80 87 86 91Q84 98 77 99Z" /></g>
<g id="hands-up">
      <g id="wave"><path fill="var(--sleeve)" d="M55 88Q48 85 42 80L33 85Q36 100 49 106Q56 107 61 99Z" /><path fill="var(--cuff)" d="M32 83L41 77Q44 77 46 82L35 90Q32 90 32 83Z" /><path fill="var(--skin)" d="M33 85Q24 81 24 73Q24 68 28 70L32 74Q29 66 33 66Q36 65 39 73Q42 69 44 72Q46 76 41 81Z" /></g>
      <use href="#wave" transform="translate(144) scale(-1 1)" />
