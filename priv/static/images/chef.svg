<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" class="stage-1 idle" role="img" aria-labelledby="chef-title">
  <title id="chef-title">Tore's kitchen companion</title>
  <style>
    svg { --skin:#efb286; --curl:#574039; --ink:#49352f; --linen:#fff0d8; --shade:#dfd0b6; --leaf:#46765b; --cuff:#f1ddbc; --sleeve:#fff0d8 }
    .stage { display:none }
    svg:not([data-stage]).stage-1 #stage-1, svg[data-stage="1"] #stage-1,
    svg:not([data-stage]).stage-2 #stage-2, svg[data-stage="2"] #stage-2,
    svg:not([data-stage]).stage-3 #stage-3, svg[data-stage="3"] #stage-3,
    svg:not([data-stage]).stage-4 #stage-4, svg[data-stage="4"] #stage-4,
    svg:not([data-stage]).stage-5 #stage-5, svg[data-stage="5"] #stage-5 { display:inline }
    .raised,.glint,.oh { opacity:0 }
    .breath,.hop { transform-origin:72px 133px }
    .eyes,.hat,.peel,.herbs,.fire,.glint,.raised { transform-box:fill-box; transform-origin:center }
    .herbs,.fire,.raised { transform-origin:center bottom }
    .peel { transform-origin:center top }
    .idle .breath { animation:breathe 3.6s ease-in-out infinite }
    .idle .eyes { animation:blink 4.9s ease-in-out infinite }
    .idle .bubble { animation:rise 3.4s ease-in-out infinite }
    .idle .peel { animation:swing 3s ease-in-out infinite }
    .idle .herbs { animation:sway 3s ease-in-out infinite }
    .idle .fire { animation:flicker 1.3s ease-in-out infinite }
    .idle .steam { animation:wisp 2.9s ease-in-out infinite }
    .tapped .hop { animation:hop 600ms cubic-bezier(.32,.02,.26,1) }
    .tapped .oh { animation:show 600ms ease-in-out }
    .tapped .smile { animation:hide 600ms ease-in-out }
    .cheer .raised { animation:lift 1200ms cubic-bezier(.22,.75,.24,1) }
    .cheer .working { animation:hide 1200ms ease-in-out }
    .cheer .hat { animation:toss 1200ms cubic-bezier(.28,.02,.26,1) }
    .cheer .glint { animation:twinkle 1200ms ease-in-out }
    @keyframes breathe { 50% { transform:scale(.993,1.012) } }
    @keyframes blink { 0%,55%,59%,100% { transform:scaleY(1) } 57% { transform:scaleY(.12) } }
    @keyframes rise { 0%,100% { opacity:.85; transform:translate(-1px,1px) } 55% { opacity:1; transform:translate(2px,-6px) } 74% { opacity:0; transform:translate(3px,-9px) } 75% { opacity:0; transform:translate(-1px,3px) } }
    @keyframes swing { 0%,100% { transform:rotate(-4deg) } 50% { transform:rotate(6deg) } }
    @keyframes sway { 50% { transform:rotate(-7deg) } }
    @keyframes flicker { 48% { transform:skewX(-6deg) scale(.93,1.12) } 78% { transform:skewX(3deg) scale(1.04,.95) } }
    @keyframes wisp { 0% { opacity:0; transform:translateY(3px) } 42% { opacity:.85 } 100% { opacity:0; transform:translateY(-4px) } }
    @keyframes hop { 19% { transform:scale(1.06,.94) } 48% { transform:translateY(-5.5px) scale(.97,1.015) } 73% { transform:scale(1.035,.96) } 89% { transform:scale(.99,1.012) } }
    @keyframes show { 0%,100% { opacity:0 } 16%,80% { opacity:1 } }
    @keyframes hide { 0%,100% { opacity:1 } 16%,80% { opacity:0 } }
    @keyframes lift { 0%,100% { opacity:0; transform:translateY(6px) scaleX(.92) } 16%,80% { opacity:1 } 31% { transform:translateY(-2px) scaleX(1.02) } 50%,80% { transform:none } }
    @keyframes toss { 15% { transform:translateY(1px) } 36% { transform:translateY(-5px) rotate(-4deg) } 58% { transform:rotate(2deg) } 73% { transform:translateY(-1px) } }
    @keyframes twinkle { 0%,18%,85%,100% { opacity:0; transform:scale(.5) } 43%,65% { opacity:1; transform:scale(1) } }
    @keyframes fade { 45% { opacity:.64 } }
    @media (prefers-reduced-motion:reduce) {
      .idle *, .tapped *, .cheer * { animation:none !important }
      .tapped .hop { animation:fade 600ms ease-in-out !important }
      .cheer .hop { animation:fade 1200ms ease-in-out !important }
    }
  </style>
