    <g id="coat"><path fill="var(--shade)" d="M72 77C92 77 104 91 106 115Q108 125 98 127Q73 132 46 127Q39 125 39 119C40 97 49 78 72 77Z"/><path fill="var(--linen)" d="M71 78C92 78 101 94 102 115Q104 122 96 124Q71 129 44 123Q40 122 40 117C43 94 50 78 71 78Z"/><path d="M76 94Q80 108 79 123" stroke="#d7c6ab" fill="none" stroke-width="1.5"/><g fill="#817261"><circle cx="73" cy="104" r="1.9"/><circle cx="73.5" cy="114" r="1.9"/></g></g>
