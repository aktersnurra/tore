    <ellipse id="gasp" fill="var(--ink)" cx="1" cy="15" rx="3.4" ry="4.2"/>
    <g id="clogs"><path fill="#56655b" d="M47 117H96L92 132H78L73 124L69 132H52Z"/><path fill="var(--curl)" d="M54 127Q61 125 68 129L68 133Q67 136 62 136H49Q44 135 46 132Q48 128 54 127ZM80 128Q88 125 94 129Q102 130 101 134Q100 136 95 136H80Q76 135 77 132Z"/></g>
